; Guante v3: 7 flex + 10 potenciometros + 2 multiplexores - ESP32-C3 Mini (USB nativo)
[platformio]
; El .ino queda en esta carpeta (sigue abriendo en el IDE de Arduino)
src_dir = .

[env:guante_v3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
; Compila solo el sketch, sin entrar a la carpeta de compilación .pio
build_src_filter = +<*> -<.pio/> -<.vscode/>
; Completar con el COM de la C3 (si se borra, PlatformIO lo detecta solo)
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
; "direct" deja pasar los codigos ANSI que dibujan la tabla fija en el monitor
monitor_filters = direct
lib_deps =
    adafruit/Adafruit ADS1X15
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
