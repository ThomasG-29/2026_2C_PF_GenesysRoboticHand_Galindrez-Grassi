; Mano robot definitiva: ESP-NOW -> 7 servos (PCA9685) - ESP32 (CP210x, COM3)
; Recibe los 7 flex de "5. Guante - ESP32-C3(Transmisor)".
; src/paquete.h tiene que ser igual al del transmisor.
;
; Con el capacitor de 10 uF entre EN y GND entra sola al modo descarga
; (antes habia que mantener apretado BOOT al grabar).

[env:mano_esp32]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM3
; A 460800 la grabacion se corta ("Packet content transfer stopped")
upload_speed = 115200
monitor_port = COM3
monitor_speed = 115200
; Evita que abrir el monitor deje la placa en modo descarga
monitor_dtr = 0
monitor_rts = 0
; Muestra lo que se escribe (para los comandos de calibracion)
monitor_echo = yes
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
