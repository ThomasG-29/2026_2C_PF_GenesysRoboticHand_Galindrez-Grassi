; Prueba de mecanica: 16 servos a mano por el monitor serie - ESP32 (CP210x, COM3)
; Misma placa y conexionado que "5. Mano - ESP32(Receptor)".
[platformio]
; El .ino queda en esta carpeta (sigue abriendo en el IDE de Arduino)
src_dir = .

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
; Compila solo el sketch, sin entrar a la carpeta de compilacion .pio
build_src_filter = +<*> -<.pio/> -<.vscode/>
upload_port = COM3
; A 460800 la grabacion se corta ("Packet content transfer stopped")
upload_speed = 115200
monitor_port = COM3
monitor_speed = 115200
; Evita que abrir el monitor deje la placa en modo descarga
monitor_dtr = 0
monitor_rts = 0
; Muestra lo que se escribe
monitor_echo = yes
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
