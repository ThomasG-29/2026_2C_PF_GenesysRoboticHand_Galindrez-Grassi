; Prueba de 16 servos con PCA9685 - ESP32 (CP210x, COM3)
; Esta placa no tiene auto-reset al modo descarga:
; mantener apretado BOOT cuando aparezca "Connecting...".
[platformio]
; El .ino queda en esta carpeta (sigue abriendo en el IDE de Arduino)
src_dir = .

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
; Compila solo el sketch, sin entrar a la carpeta de compilación .pio
build_src_filter = +<*> -<.pio/> -<.vscode/>
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
; Evita que abrir el monitor deje la placa en modo descarga
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
