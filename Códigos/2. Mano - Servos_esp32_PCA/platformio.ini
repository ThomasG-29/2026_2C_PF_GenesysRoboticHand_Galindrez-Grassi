; Prueba de dedos SIN guante: barre los servos de pulgar, indice y medio de a uno.
; Mismo ESP32 y circuito que "5. Mano - ESP32(Receptor)" (CP210x, COM3, PCA9685 en GPIO21/22).
; Despues de la prueba, volver a grabar "5. Mano - ESP32(Receptor)".
; Con el capacitor de 10 uF entre EN y GND entra sola al modo descarga (no hace falta BOOT).
[platformio]
; El .ino queda en esta carpeta (sigue abriendo en el IDE de Arduino)
src_dir = .

; Nombre unico: con dos proyectos con el mismo env, Upload graba el proyecto equivocado
[env:prueba_dedos]
platform = espressif32
board = esp32dev
framework = arduino
; Compila solo el sketch, sin entrar a la carpeta de compilación .pio
build_src_filter = +<*> -<.pio/> -<.vscode/>
upload_port = COM3
; A 460800 la grabacion se corta ("Packet content transfer stopped")
upload_speed = 115200
monitor_port = COM3
monitor_speed = 115200
; Evita que abrir el monitor deje la placa en modo descarga
monitor_dtr = 0
monitor_rts = 0
; Muestra lo que se escribe
monitor_echo = yes
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
