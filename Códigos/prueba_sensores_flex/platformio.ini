; Prueba de 1 sensor flex + servo - Arduino Uno
[platformio]
; El .ino queda en esta carpeta (sigue abriendo en el IDE de Arduino)
src_dir = .

[env:uno]
platform = atmelavr
board = uno
framework = arduino
; Compila solo el sketch, sin entrar a la carpeta de compilación .pio
build_src_filter = +<*> -<.pio/> -<.vscode/>
; El puerto se detecta solo; si hay varias placas, descomentar:
; upload_port = COMx
monitor_speed = 9600
lib_deps =
    arduino-libraries/Servo
