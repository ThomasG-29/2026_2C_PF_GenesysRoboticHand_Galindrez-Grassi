; Prueba ESP-NOW: flex 1 del guante (ESP32-C3) -> servo de la mano (ESP32)
; Un proyecto con dos entornos. Cada uno compila solo su archivo de src/:
;   transmisor_c3  -> src/transmisor.cpp  (ESP32-C3 mini, COM5)
;   receptor_esp32 -> src/receptor.cpp    (ESP32, COM3)
; src/paquete.h lo comparten los dos.

[env]
framework = arduino
platform = espressif32
monitor_speed = 115200

[env:transmisor_c3]
board = esp32-c3-devkitm-1
build_src_filter = -<*> +<transmisor.cpp>
upload_port = COM5
monitor_port = COM5
lib_deps =
    adafruit/Adafruit ADS1X15
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Esta placa no tiene auto-reset al modo descarga:
; mantener apretado BOOT cuando aparezca "Connecting...".
[env:receptor_esp32]
board = esp32dev
build_src_filter = -<*> +<receptor.cpp>
upload_port = COM3
; A 460800 la grabacion se corta ("Packet content transfer stopped")
upload_speed = 115200
monitor_port = COM3
; Evita que abrir el monitor deje la placa en modo descarga
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    madhephaestus/ESP32Servo
