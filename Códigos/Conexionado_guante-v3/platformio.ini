; Guante v3: 7 flex + 10 potenciometros + 2 multiplexores - ESP32-S3 Mini (USB nativo)
[platformio]
; El .ino queda en esta carpeta (sigue abriendo en el IDE de Arduino)
src_dir = .

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; Compila solo el sketch, sin entrar a la carpeta de compilación .pio
build_src_filter = +<*> -<.pio/> -<.vscode/>
; La S3 Mini tiene 4 MB de flash (la devkitc-1 trae 8 MB por defecto)
board_upload.flash_size = 4MB
board_build.partitions = default.csv
; Completar con el COM de la S3 (si se borra, PlatformIO lo detecta solo)
; upload_port = COMx
; monitor_port = COMx
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit ADS1X15
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
