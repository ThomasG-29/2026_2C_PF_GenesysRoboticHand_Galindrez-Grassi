; Guante definitivo: 7 flex -> ESP-NOW - ESP32-C3 Mini (USB nativo, COM5)
; Envia la resistencia de cada flex a "5. Mano - ESP32(Receptor)".
; src/paquete.h tiene que ser igual al del receptor.

[env:guante_c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit ADS1X15
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
